# merihari ─ 作業用 BGM のカタログ(data/bgm.json)を todaybgm(同じ作者・週次で曲を補充)から毎週作り直す(v0.32.1・F16-1)。
# 無料: 公開リポジトリの GitHub Actions。todaybgm の songs.json(土 6:00 JST に更新)を土 7:00 JST に取り、変わったときだけ commit。
# 版は上げない: data/bgm.json は SW の「先読み+裏で更新」(stale-while-revalidate)なので、次に開いたときに新しいカタログになる。
name: update-bgm
on:
  schedule:
    - cron: '0 22 * * 5'   # 土 7:00 JST(= 金 22:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: todaybgm の songs.json を取る
        run: curl -fsSL -o /tmp/songs.json https://raw.githubusercontent.com/zuno1000/todaybgm/main/songs.json
      - name: data/bgm.json を作り直す
        run: python -X utf8 -I tools/bgm_catalog.py /tmp/songs.json
      - name: 変わっていれば commit
        run: |
          if git diff --quiet -- data/bgm.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bgm.json
          git commit -m "bgm: カタログを todaybgm から更新($(date -u +%Y-%m-%d))"
          git push
