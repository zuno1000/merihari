<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>merihari tests</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;display:flex;gap:16px;flex-wrap:wrap}
pre{flex:1;min-width:320px;white-space:pre-wrap;font-size:13px;margin:0}
iframe{width:390px;height:720px;border:1px solid #ccc;flex:none}
.sum{font-weight:700}
</style>
</head>
<body>
<pre id="out">loading…</pre>
<iframe id="app" src="../index.html" title="app under test"></iframe>
<script>
// 仕様書 §9: iframe 方式・localhost ガード・try/finally・ネガティブコントロール1件。
// 純関数だけを検証し、アプリの localStorage には触らない。v0.15: 理想スケジュール(buildPlan ほか)のテストは廃止し、「目安」(plan.goals ほか)に置き換えた。
if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  document.body.textContent = 'localhost でのみ実行(python -m http.server 8000 → http://localhost:8000/tests/)';
  throw new Error('not localhost');
}
const out = document.getElementById('out');
let fails = 0, total = 0;
const log = (s) => { out.textContent += s + '\n'; };
function ok(cond, msg) { total++; if (!cond) fails++; log((cond ? 'ok   ' : 'FAIL ') + msg); }
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const throws = (fn) => { try { fn(); return false; } catch { return true; } };

document.getElementById('app').addEventListener('load', async () => {
  out.textContent = '';
  const W = document.getElementById('app').contentWindow;
  const M = W.M;
  try {
    ok(M && typeof M === 'object', 'window.M が公開されている');
    const { time: T, store: S } = M;

    // ---- time.js ----
    log('\n# time');
    ok(T.hm('07:30') === 450 && T.hm('7:05') === 425, 'hm: HH:MM → 分');
    ok(T.hm('x') === null && T.hm('31:00') === null && T.hm(null) === null && T.hm('25:00') === 1500 && T.hm('24:10') === 1450, 'hm: 壊れた値は null・翌日の深夜(30:00まで)は24時間超の分');
    ok(T.mm(450) === '07:30' && T.mm(0) === '00:00', 'mm: 分 → HH:MM');
    ok(T.dateKey(new Date(2026, 9, 11)) === '2026-10-11', 'dateKey: ローカル YYYY-MM-DD');
    ok(T.dateKey(T.parseDateKey('2026-02-03')) === '2026-02-03', 'parseDateKey ↔ dateKey が往復する');
    ok(T.addDays('2026-10-31', 1) === '2026-11-01' && T.addDays('2026-01-01', -1) === '2025-12-31', 'addDays: 月またぎ・年またぎ');
    ok(T.weekday('2026-10-11') === 0 && T.dayKeyOf('2026-10-12') === 'mon', 'weekday / dayKeyOf');
    const d = S.defaultSettings();
    ok(eq(T.windowFor(d, '2026-10-11'), { start: 480, end: 1380 }), 'windowFor: 日曜は08:00〜23:00');
    ok(eq(T.windowFor(d, '2026-10-12'), { start: 420, end: 1410 }), 'windowFor: 月曜は07:00〜23:30');
    ok(T.windowFor({ window: { mon: ['23:00', '07:00'] } }, '2026-10-12') === null, 'windowFor: 終了≦開始は null');
    ok(eq(T.mergeIntervals([{ start: 10, end: 20 }, { start: 15, end: 30 }, { start: 40, end: 50 }, { start: 5, end: 5 }]),
      [{ start: 10, end: 30 }, { start: 40, end: 50 }]), 'mergeIntervals: 重なりをまとめ空区間を捨てる');
    ok(eq(T.subtractIntervals([{ start: 0, end: 100 }], [{ start: 10, end: 20 }, { start: 90, end: 120 }]),
      [{ start: 0, end: 10 }, { start: 20, end: 90 }]), 'subtractIntervals: 中抜き・端欠け');
    ok(T.sumMin([{ start: 0, end: 10 }, { start: 20, end: 25 }]) === 15, 'sumMin');
    ok(T.fmtMin(80) === '1h20m' && T.fmtMin(45) === '45m' && T.fmtMin(120) === '2h' && T.fmtMin(0) === '0m', 'fmtMin');
    ok(T.fmtMinJa(80) === '1時間20分' && T.fmtMinJa(60) === '1時間', 'fmtMinJa');
    ok(T.routinesFor === undefined && T.usableMin === undefined && T.workableMin === undefined, 'v0.15: ルーティン・使える時間の計算は廃止(理想スケジュールと一緒に)');

    // ---- store.js ----
    log('\n# store');
    const base = S.migrate(null);
    ok(base.schema === S.SCHEMA && base.settings.categories.length === 11 && eq(base.entries, {}), 'migrate(null): 既定データ(カテゴリ11件・v0.12で睡眠を追加)');
    ok(S.defaultSettings().categories !== S.defaultSettings().categories, 'defaultSettings: 呼ぶたびに新しいオブジェクト');
    ok(base.settings.habitsMigrated === true && !('habits' in base.settings) && !('routines' in base.settings) && !('ratio' in base.settings), 'defaultSettings(v0.15): 理想スケジュール用の設定を持たない');
    const broken = S.migrate({ schema: 1, bar: 2, settings: { transitMin: 'abc', ratio: 5, window: { mon: ['bad'] }, routines: [{ id: 'x', start: '9:00' }], restEvery: { workMin: 90 }, longRest: { min: 60 }, outingMemory: { '1:600': 'out' }, foo: 1 }, entries: 'nope' });
    ok(!('transitMin' in broken.settings) && !('ratio' in broken.settings) && !('routines' in broken.settings) && !('restEvery' in broken.settings) && !('longRest' in broken.settings) && !('outingMemory' in broken.settings), 'migrate(v0.15): 旧設定(移動・割合・ルーティン・休憩・外出)は捨てる');
    ok(eq(broken.settings.window.mon, ['07:00', '23:30']) && eq(broken.settings.window.sat, ['08:00', '23:00']), 'migrate: 壊れた曜日だけ既定値へ');
    ok(broken.settings.foo === 1 && broken.bar === 2, 'migrate: 未知キーを保持(前方互換)');
    ok(eq(broken.entries, {}) && eq(broken.meta.resetAt, null), 'migrate: entries/meta を補完');
    ok(eq(S.migrate({ schema: 1, settings: { busyMemory: { '1:540': 'class', '2:600': '', 'x': 'a', '3:615': 5 } } }).settings.busyMemory, { '1:540': 'class', '2:600': '' }), 'migrate: 予定のラベルの記憶はキーと文字列を検証');
    const legacy = S.migrate({ schema: 1, settings: { categories: [{ id: 'research', name: '研究', kind: 'work', color: '#2b6cb0', order: 1 }, { id: 'sns', name: 'SNS', kind: 'drift', color: '#123456', order: 2 }, { id: 'new', name: 'x', kind: 'work', color: 'bad', order: 3 }] } });
    ok(legacy.settings.categories[0].color === '#9ccbee' && legacy.settings.categories[1].color === '#123456' && legacy.settings.categories[2].color === '#cfd7e1', 'migrate: 旧既定色(v0.4.0)は新既定色(パステル)へ・自分で変えた色は保持・壊れた色は灰');
    ok(S.migrate({ schema: 1, settings: { categories: [{ id: 'research', name: '研究', kind: 'work', color: '#2a78d6', order: 1 }, { id: 'sns', name: 'SNS', kind: 'drift', color: '#e34948', order: 2 }] } }).settings.categories.slice(0, 2).map((c) => c.color).join() === '#9ccbee,#f7bdbd' && S.migrate({ schema: 1, settings: { categories: [{ id: 'rest', name: '休憩', kind: 'rest', color: '#9fd8a0', order: 1 }] } }).settings.categories[0].color === '#cfe9c3', 'migrate(v0.15.1/0.15.2): v0.4.1〜v0.15.1の既定色も新しいパステルへ');
    // ---- v0.15.2: 種別(増減できる)・非表示のカテゴリ ----
    ok(base.settings.kinds.length === 6 && base.settings.kinds[0].id === 'work' && base.settings.categories.find((c) => c.id === 'class').kind === 'fixed' && base.settings.categories.find((c) => c.id === 'research').kind === 'work', 'defaultSettings(v0.15.2): 種別6件・授業は「決まった作業」');
    const oldK = S.migrate({ schema: 1, settings: { categories: [{ id: 'class', name: '授業', kind: 'work', color: '#2a78d6', order: 1 }, { id: 'research', name: '研究', kind: 'work', color: '#2a78d6', order: 2 }, { id: 'x', name: 'x', kind: 'nope', color: '#2a78d6', order: 3 }] } }).settings;
    ok(oldK.kinds.length === 6 && oldK.categories[0].kind === 'fixed' && oldK.categories[1].kind === 'work' && oldK.categories[2].kind === 'work' && oldK.kindSchema === 1, 'migrate(v0.15.2): 旧データの授業は1回だけ「決まった作業」へ・知らない種別は work');
    const myK = S.migrate({ schema: 1, settings: { kinds: [{ id: 'hobby', name: '趣味', work: 'yes', drift: false }, { id: 'w', name: '仕事', work: true }], categories: [{ id: 'class', name: '授業', kind: 'work', color: '#2a78d6', order: 1 }, { id: 'g', name: 'ギター', kind: 'hobby', color: '#2a78d6', order: 2 }] } }).settings;
    ok(myK.kinds.length === 2 && myK.kinds[0].work === false && myK.categories[0].kind === 'hobby' && myK.categories[1].kind === 'hobby', 'migrate(v0.15.2): 自分で定義した種別はそのまま(真偽値は検証・無い種別は先頭へ・授業の移行はしない)');
    ok(S.kindRole(myK, 'w').work === true && S.kindRole(myK, 'hobby').work === false && S.kindRole({}, 'fixed').work === true && S.kindRole({}, 'drift').drift === true && S.catRole(myK, 'g').name === '趣味' && S.catRole({}, 'sns').drift === true, 'kindRole / catRole: 種別の役割(settings に kinds が無ければ既定)');
    ok(S.migrate({ schema: 1, settings: { categories: [{ id: 'a', name: 'a', kind: 'work', color: '#2a78d6', order: 1, archived: true }, { id: 'b', name: 'b', kind: 'work', color: '#2a78d6', order: 2, archived: 'x' }] } }).settings.categories.slice(0, 2).map((c) => c.archived).join() === 'true,false', 'migrate(v0.15.2): archived は真偽値だけ');
    const once = S.migrate({ schema: 1, settings: { gapAbsorbMin: 15 } });
    ok(eq(S.migrate(once), once), 'migrate: 冪等');
    ok(once.settings.gapAbsorbMin === 15, 'migrate: 正しい値は保持');
    // v0.15: 旧「毎日の習慣」→ タスク(毎日 ◯分)
    const hb = S.migrate({ schema: 1, settings: { habits: [{ id: 'h1', name: '英語', categoryId: 'english', min: 30, prefer: 'morning' }, { name: '' }] }, tasks: {} });
    ok(hb.tasks.habit_h1 && hb.tasks.habit_h1.repeat.type === 'daily' && hb.tasks.habit_h1.repeat.min === 30 && hb.tasks.habit_h1.categoryId === 'english' && hb.tasks.habit_h1.kind === 'duty' && Object.keys(hb.tasks).length === 1, 'migrate(v0.15): 習慣は「毎日30分」のタスクになる(名前の無いものは捨てる)');
    ok(hb.settings.habitsMigrated === true && !('habits' in hb.settings) && eq(S.migrate(hb), hb), 'migrate(v0.15): 移したら印を立てて habits を消す・冪等');
    const hb2 = S.migrate({ schema: 1, settings: { habits: [{ id: 'h1', name: '英語', categoryId: 'english', min: 30 }] }, tasks: { habit_h1: { id: 'habit_h1', name: '英語(自分で直した)', repeat: { type: 'daily', min: 45 }, updatedAt: 'x' } } });
    ok(hb2.tasks.habit_h1.repeat.min === 45 && hb2.tasks.habit_h1.name === '英語(自分で直した)', 'migrate(v0.15): 同じ id のタスクがあれば上書きしない');
    ok(!('habit_h1' in S.migrate({ schema: 1, settings: { habitsMigrated: true, habits: [{ id: 'h1', name: '英語', min: 30 }] }, tasks: {} }).tasks), 'migrate(v0.15): 移行済みの印があれば habits を無視して捨てる');
    ok(S.migrate({ schema: 1, tasks: { t: { id: 't', name: 't', repeat: { type: 'daily', min: 'x' } }, u: { id: 'u', name: 'u', repeat: { type: 'daily', min: 999 } }, v: { id: 'v', name: 'v', repeat: { type: 'monthly' } } } }).tasks.t.repeat.min === 30 && S.migrate({ schema: 1, tasks: { u: { id: 'u', name: 'u', repeat: { type: 'daily', min: 999 } } } }).tasks.u.repeat.min === 30 && S.migrate({ schema: 1, tasks: { v: { id: 'v', name: 'v', repeat: { type: 'monthly' } } } }).tasks.v.repeat === null, 'validateTask: 毎日型は5〜600分・知らない繰り返しは無し');
    ok(throws(() => S.validateImport({})) && throws(() => S.validateImport([1])) && throws(() => S.validateImport('x')), 'validateImport: merihari 以外は拒否');
    ok(throws(() => S.validateImport({ schema: 99, settings: {} })), 'validateImport: 新しい schema は拒否');
    ok(S.validateImport({ schema: 1, settings: {} }).schema === 1, 'validateImport: 通れば migrate 済みを返す');

    // ---- log.js(F1) ----
    log('\n# log');
    const L = M.log;
    let seq = 0;
    const C = { uid: () => 'e' + (++seq), nowISO: () => '2026-10-11T16:00:00+09:00' };
    const D = '2026-10-11';
    const alive = (es) => Object.values(es).filter((e) => !e.deletedAt).sort((a, b) => T.hm(a.start) - T.hm(b.start)).map((e) => `${e.categoryId} ${e.start}-${e.end ?? 'open'}`);
    const wEnd = () => 1410; // 23:30
    let es = {};
    let r = L.start(es, { date: D, nowMin: 870, categoryId: 'research', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-open']), 'start: 現在時刻から記録中エントリを作る');
    ok(eq(es, {}), 'start: 引数の entries を変更しない(純関数)');
    es = r.entries;
    r = L.start(es, { date: D, nowMin: 880, categoryId: 'research', windowEndOf: wEnd }, C);
    ok(r.ignored === true && eq(alive(r.entries), ['research 14:30-open']), 'start: 同じカテゴリの連打は無視(F1-1)');
    r = L.start(es, { date: D, nowMin: 900, categoryId: 'rest', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-open']), 'start: 次のチップで直前を現在時刻で閉じる(連続記録)');
    es = r.entries;
    r = L.stop(es, { date: D, nowMin: 915, windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:15']) && r.closed.categoryId === 'rest', 'stop: 記録中を現在時刻で閉じる');
    es = r.entries;
    ok(L.openEntry(es) === null && L.openEntry(r.entries) === null, 'openEntry: 記録中が無ければ null');
    r = L.start(es, { date: D, nowMin: 965, startMin: 930, categoryId: 'english', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:15', 'english 15:30-open']), 'start: さっきから(startMin)で過去から記録中にできる(F1-2)');
    es = r.entries;
    r = L.start(es, { date: D, nowMin: 965, startMin: 905, categoryId: 'sns', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:05', 'sns 15:05-open']), 'start: 事後入力が記録中と重なれば記録中は捨て、前の記録は詰める');
    r = L.stop(es, { date: D, nowMin: 1000, windowEndOf: wEnd }, C);
    es = r.entries; // research 14:30-15:00, rest 15:00-15:15, english 15:30-16:40
    const engId = Object.values(es).find((e) => e.categoryId === 'english').id;
    r = L.setTimes(es, engId, { start: '15:10', end: '16:00' }, 1000, C);
    ok(eq(alive(r), ['research 14:30-15:00', 'rest 15:00-15:10', 'english 15:10-16:00']), 'setTimes: 時刻編集で隣を詰める(F1-7)');
    ok(throws(() => L.setTimes(es, engId, { start: '16:00', end: '15:00' }, 1000, C)), 'setTimes: 終了≦開始は拒否');
    let big = L.start({}, { date: D, nowMin: 600, startMin: 540, categoryId: 'life', windowEndOf: wEnd }, C).entries;
    big = L.stop(big, { date: D, nowMin: 1080, windowEndOf: wEnd }, C).entries; // life 09:00-18:00
    let mid = L.start(big, { date: D, nowMin: 870, categoryId: 'research', windowEndOf: wEnd }, C); // 14:30に生活の途中で研究を開始
    mid = L.stop(mid.entries, { date: D, nowMin: 960, windowEndOf: wEnd }, C).entries; // 16:00に終了 → 生活の後半が残る
    ok(eq(alive(mid), ['life 09:00-14:30', 'research 14:30-16:00', 'life 16:00-18:00']), 'resolveOverlap: 真ん中に入れると前後に分割される');
    const covered = L.setTimes(mid, Object.values(mid).find((e) => e.categoryId === 'research').id, { start: '08:00', end: '19:00' }, 1200, C);
    ok(eq(alive(covered), ['research 08:00-19:00']) && Object.values(covered).filter((e) => e.deletedAt).length === 2, 'resolveOverlap: 丸ごと覆われた記録は tombstone(deletedAt)で残る');
    let ys = { a: { id: 'a', date: '2026-10-10', start: '22:00', end: null, categoryId: 'research', updatedAt: 'x', deletedAt: null } };
    r = L.closeOpen(ys, { date: D, at: 600, windowEndOf: () => 1410 }, C);
    ok(r.closed.end === '23:30', 'closeOpen: 前日の記録中はその日の作業時間帯の終わりで閉じる(F1-3)');
    r = L.closeOpen(ys, { date: D, at: 600, windowEndOf: () => 1300 }, C);
    ok(r.closed.end === '24:00', 'closeOpen: 作業時間帯の終わりが開始より前なら24:00');
    r = L.start(ys, { date: D, nowMin: 600, categoryId: 'research', windowEndOf: () => 1410 }, C);
    ok(eq(alive(r.entries), ['research 10:00-open', 'research 22:00-23:30']), 'start: 前日の同カテゴリ記録中は無視せず閉じて今日の分を作る');
    ok(L.elapsedMin({ start: '14:30', end: null, date: D }, D, 900) === 30 && L.elapsedMin(ys.a, D, 600) === 120, 'elapsedMin: 同日は now まで・別日は24:00まで');
    ok(L.isStale({ start: '10:00', end: null, date: D }, D, 780) && !L.isStale({ start: '10:00', end: null, date: D }, D, 700), 'isStale: 3時間以上で止め忘れ(F1-4)');
    ok(eq(L.totalsByCategory(mid, D, 1200), { life: 450, research: 90 }), 'totalsByCategory');
    const cands = L.backfillCandidates(es, D, 1000);
    ok(cands[0].min === 915 && eq(cands.map((c) => c.min), [915, 985, 970, 940]), 'backfillCandidates: 直前の終わり/15分前/30分前/1時間前(重複なし)');
    ok(eq(L.backfillCandidates({}, D, 20).map((c) => c.min), [5]), 'backfillCandidates: 0:00より前の候補は出さない');
    const sp = L.split(mid, Object.values(mid).find((e) => e.categoryId === 'research').id, 900, 1200, C);
    ok(eq(alive(sp), ['life 09:00-14:30', 'research 14:30-15:00', 'research 15:00-16:00', 'life 16:00-18:00']), 'split: ここで分ける');
    ok(throws(() => L.split(mid, Object.values(mid)[0].id, 1300, 1200, C)), 'split: 範囲外は拒否');
    const rm = L.remove(es, engId, C);
    ok(rm[engId].deletedAt && !es[engId].deletedAt && L.entriesOf(rm, D).length === 2, 'remove: tombstone・元は変更しない・entriesOf から消える');
    const added = L.addEntry({ x: { id: 'x', date: D, start: '09:00', end: '12:00', categoryId: 'life', updatedAt: 'x', deletedAt: null } }, { date: D, startMin: 600, endMin: 660, categoryId: 'research' }, C);
    ok(eq(alive(added), ['life 09:00-10:00', 'research 10:00-11:00', 'life 11:00-12:00']), 'addEntry: 閉じた記録を追加し隣を詰める(分割)');
    ok(throws(() => L.addEntry({}, { date: D, startMin: 660, endMin: 600, categoryId: 'a' }, C)), 'addEntry: 終了≦開始は拒否');
    ok(L.fillFromPlan === undefined, 'v0.15: 「理想どおりだった」(fillFromPlan)は廃止');
    // v0.15.8: 取り消し(同期に負けない戻し方)
    const snap0 = { a: { id: 'a', date: D, start: '09:00', end: '10:00', categoryId: 'research', updatedAt: '2026-10-11T10:00:00+09:00', deletedAt: null }, b: { id: 'b', date: D, start: '10:00', end: '11:00', categoryId: 'sns', updatedAt: '2026-10-11T11:00:00+09:00', deletedAt: null } };
    const cur0 = { a: { ...snap0.a, end: '10:30', updatedAt: '2026-10-11T12:00:00+09:00' }, c: { id: 'c', date: D, start: '11:00', end: '12:00', categoryId: 'rest', updatedAt: '2026-10-11T12:00:00+09:00', deletedAt: null } }; // b を消し・a を直し・c を足した
    const rv = L.revertTo(cur0, snap0, C);
    ok(rv.a.end === '10:00' && rv.a.updatedAt === C.nowISO() && rv.b.end === '11:00' && rv.b.updatedAt === C.nowISO() && rv.c.deletedAt === C.nowISO() && Object.keys(rv).length === 3 && cur0.a.end === '10:30' && snap0.a.updatedAt === '2026-10-11T10:00:00+09:00', 'revertTo: 控えの状態に戻し、変わる記録には新しい updatedAt・あとから足した記録は tombstone(入力は変えない)');
    ok(eq(L.revertTo(snap0, snap0, C), snap0), 'revertTo: 同じなら何も押さない');
    // v0.15.12: 同期のあとの整え(重なり・二重の記録中)
    const mgE = { a: { id: 'a', date: D, start: '09:00', end: '11:00', categoryId: 'research', updatedAt: '2026-10-11T11:00:00+09:00', deletedAt: null }, b: { id: 'b', date: D, start: '10:00', end: '12:00', categoryId: 'class', updatedAt: '2026-10-11T12:00:00+09:00', deletedAt: null }, c: { id: 'c', date: '2026-10-10', start: '09:00', end: '10:00', categoryId: 'rest', updatedAt: '2026-10-10T10:00:00+09:00', deletedAt: null } };
    const nm1 = L.normalizeAfterMerge(mgE, C);

      ok(B.thumbUrl('a b') === 'https://i.ytimg.com/vi/a%20b/mqdefault.jpg' && B.watchUrl('a b') === 'https://www.youtube.com/watch?v=a%20b' && B.appUrl('x').startsWith('youtube://www.youtube.com/watch?v=x') && B.intentUrl('x').startsWith('intent://www.youtube.com/watch?v=x#Intent;package=com.google.android.youtube;') && B.intentUrl('x').includes('S.browser_fallback_url=https%3A%2F%2Fwww.youtube.com'), 'thumbUrl / watchUrl / appUrl / intentUrl: id はエンコード・Android はブラウザへのフォールバックつき');
      ok(B.platformOf('Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)') === 'ios' && B.platformOf('Mozilla/5.0 (Macintosh)', 5, 'MacIntel') === 'ios' && B.platformOf('Mozilla/5.0 (Linux; Android 14)') === 'android' && B.platformOf('Mozilla/5.0 (Windows NT 10.0)') === 'other', 'platformOf: iPhone / iPad(MacIntel+タッチ)/ Android / それ以外');
      ok(B.urlFor('x', true, 'ios') === B.appUrl('x') && B.urlFor('x', true, 'android') === B.intentUrl('x') && B.urlFor('x', true, 'other') === B.watchUrl('x') && B.urlFor('x', false, 'ios') === B.watchUrl('x'), 'urlFor: アプリで開くは iOS がスキーム・Android が intent・PC と「ブラウザで」は watch URL');
      const vp = S.validateBgmPlay({ id: 'aaaaaa01', at: '2026-10-29T10:00:00+09:00', rating: 1, note: 'x' }, 'k');
      ok(vp && vp.id === 'aaaaaa01' && vp.date === '2026-10-29' && vp.rating === 1 && vp.deletedAt === null && S.validateBgmPlay({ at: '2026-10-29T10:00:00+09:00', rating: 5 }, 'bbbbbb02').rating === null && S.validateBgmPlay({ id: 'bad id!', at: '1' }, 'k') === null && S.validateBgmPlay({ id: 'aaaaaa01' }, 'k') === null, 'validateBgmPlay: id は動画 id の形・at 必須・date は at から・rating は 1 / -1 だけ');
      const mg = S.migrate({ schema: 1, settings: {}, bgm: { k1: { id: 'aaaaaa01', at: '2026-10-29T10:00:00+09:00' }, aaaaaa02: { id: 'aaaaaa02', at: '2026-10-28T10:00:00+09:00', rating: -1 }, bad: { id: 'x', at: '1' } } });

      const mm2 = M.sync.merge(ma, mb);
      ok(mm2.bgm.aaaaaa01.rating === -1 && mm2.bgm.aaaaaa03 && Object.keys(mm2.bgm).length === 2 && Object.keys(M.sync.pruneTombstones({ ...S.defaultData(), bgm: { aaaaaa01: { id: 'aaaaaa01', at: '1', updatedAt: '1', deletedAt: '2026-01-01T00:00:00+09:00' } } }, '2026-10-30T00:00:00+09:00').bgm).length === 0, 'sync.merge: 聞いた BGM は動画 id ごとに updatedAt の新しい方・古い tombstone は pruneTombstones で消える');
      ok(sw.includes(`'./js/bgm.js'`) && sw.includes(`'./js/ui-bgm.js'`) && /const DATA = \['\.\/data\/bgm\.json', '\.\/data\/feed\.json'\]/.test(sw) && !/ASSETS = \[[^\]]*bgm\.json/.test(sw), 'sw.js: bgm.js / ui-bgm.js は ASSETS・data/bgm.json は DATA(先読み+裏で更新・版と一緒に固定しない)');
      const real = await B.loadCatalog();
      ok(real && real.songs.length >= 600 && real.songs.every((s) => /^[A-Za-z0-9_-]{6,20}$/.test(s.id) && typeof s.t === 'string' && Array.isArray(s.g) && Array.isArray(s.m)) && new Set(real.songs.map((s) => s.id)).size === real.songs.length && real.songs.every((s) => s.g.every((g) => B.GENRES.includes(g))), `同梱のカタログ: ${real && real.songs.length} 曲・id の形・重複なし・ジャンルは 12 のどれか`);
    }

    // ---- v0.33 後から記入のタスク紐づけ(plan.linkable) ----
    log('\n# v0.33 linkable');
    {
      const tk = { a: { id: 'a', name: 'A', kind: 'duty', deadline: '2026-12-01' }, b: { id: 'b', name: 'B', kind: 'duty', deadline: '2026-11-01' }, c: { id: 'c', name: 'C', kind: 'wish' }, d: { id: 'd', name: 'D', kind: 'memo' }, e: { id: 'e', name: 'E', kind: 'duty', doneAt: '2026-10-01T00:00:00+09:00' }, f: { id: 'f', name: 'F', kind: 'duty', deletedAt: '2026-10-01T00:00:00+09:00' }, g: null };
      ok(eq(M.plan.linkable(tk).map((t) => t.id), ['b', 'a', 'c']) && eq(M.plan.linkable(null), []), 'plan.linkable: 開いているタスクを期限の近い順(期限なしは後ろ)・メモ / 済み / 消したものは除く(entrySheet の「タスク」・planSheet・紐づけ直しで共通)');
    }

    // ---- v0.34 feed(キャッチアップ・F17) ----
    log('\n# v0.34 feed');
    {
      const F = M.feed;
      ok(F.FEED_URL === 'data/feed.json' && eq(F.N_CHOICES, [3, 5, 8]) && F.DEFAULT_N === 5 && F.FRESH_DAYS === 14, 'feed: 一覧は同じサイトの data/feed.json・件数は 3 / 5 / 8(既定 5)');
      ok(eq(F.normalizeFeed(null), { enabled: false, genres: [], keywords: [], n: 5 }) && eq(F.normalizeFeed({ enabled: true, genres: ['research', 'bad id!', 'research'], keywords: 'LoRa, 6G、低遅延  6G', n: 8 }), { enabled: true, genres: ['research'], keywords: ['LoRa', '6G', '低遅延'], n: 8 }) && F.normalizeFeed({ n: 4 }).n === 5, 'normalizeFeed: 既定は無効・ジャンル id の形と重複・気になる語は 1 行からも(読点 / カンマ / 空白・重複なし)・件数は 3/5/8 だけ');
      ok(S.SCALAR_FIELDS.includes('feed') && eq(S.defaultSettings().feed, { enabled: false, genres: [], keywords: [], n: 5 }) && eq(S.migrate({ schema: 1, settings: { feed: { enabled: true, keywords: ['x'] } } }).settings.feed, { enabled: true, genres: [], keywords: ['x'], n: 5 }), 'feed は設定として項目ごとに同期(SCALAR_FIELDS)・migrate で検証');
      const raw = { updated: '2026-10-30T06:00:00Z', genres: [{ id: 'research', name: '研究' }, { id: 'tech', name: '技術' }, { id: 'bad!', name: 'x' }], items: [
        { id: 'aaaa000001', g: 'research', t: 'LoRa mesh for 6G', u: 'https://arxiv.org/abs/1', s: 'arXiv', d: '2026-10-30' },
        { id: 'aaaa000002', g: 'research', t: 'Old paper', u: 'https://arxiv.org/abs/2', s: 'arXiv', d: '2026-10-20' },
        { id: 'aaaa000003', g: 'tech', t: 'New JS runtime', u: 'https://example.com/a', s: 'Publickey', d: '2026-10-29' },
        { id: 'aaaa000004', g: 'tech', t: 'Another tech story', u: 'https://example.com/b', s: 'HN', d: '2026-10-28' },
        { id: 'aaaa000005', g: 'tech', t: 'Third tech', u: 'https://example.com/c', s: 'HN', d: '2026-10-27' },
        { id: 'aaaa000006', g: 'nope', t: 'unknown genre', u: 'https://example.com/d', s: 'x', d: '2026-10-30' },
        { id: 'aaaa000007', g: 'tech', t: 'javascript: bad', u: 'javascript:alert(1)', s: 'x', d: '2026-10-30' },
        { id: 'ZZ', g: 'tech', t: 'bad id', u: 'https://example.com/e', s: 'x', d: '2026-10-30' },
        { id: 'aaaa000001', g: 'tech', t: 'dup id', u: 'https://example.com/f', s: 'x', d: '2026-10-30' },
      ] };
      const f = F.parseFeed(raw);
      ok(f.updated === '2026-10-30T06:00:00Z' && eq(f.genres.map((g) => g.id), ['research', 'tech']) && eq(f.items.map((x) => x.id), ['aaaa000001', 'aaaa000002', 'aaaa000003', 'aaaa000004', 'aaaa000005']) && F.genreName(f, 'tech') === '技術' && F.genreName(f, 'zz') === 'zz', 'parseFeed: ジャンル id の形・記事は id の形 / 知らないジャンル / http(s) 以外の URL / 重複 id を捨てる');
      const marks = { aaaa000003: { id: 'aaaa000003', state: 'open', at: '2026-10-30T07:00:00+09:00', updatedAt: '…' }, aaaa000004: { id: 'aaaa000004', state: 'skip', at: '…', updatedAt: '…', deletedAt: '2026-10-30T08:00:00+09:00' } };
      ok(eq(F.unread(f.items, marks).map((x) => x.id), ['aaaa000001', 'aaaa000002', 'aaaa000004', 'aaaa000005']) && eq(F.unread(f.items, marks, ['research']).map((x) => x.id), ['aaaa000001', 'aaaa000002']), 'unread: 開いた / 読まない の印が無い記事(消した印は無視)・ジャンルで絞る');
      ok(F.keywordHits('LoRa mesh for 6G', ['lora', '6g', 'x']) === 2 && F.keywordHits('abc', []) === 0 && F.daysAgo('2026-10-28', '2026-10-30') === 2 && F.daysAgo(null, '2026-10-30') === null, 'keywordHits(大文字小文字を区別しない)/ daysAgo');
      const today = '2026-10-30';
      ok(F.score(f.items[0], { today, keywords: ['lora'] }) === 5 && F.score(f.items[0], { today }) === 2 && F.score(f.items[1], { today }) < F.score(f.items[2], { today }), 'score: 気になる語 ×3 + 新しさ(きょう 2 → 14 日で 0)');
      const p1 = F.pick(f, {}, { enabled: true, genres: [], keywords: ['6G'], n: 3 }, { today });
      ok(eq(p1.map((x) => x.id), ['aaaa000001', 'aaaa000003', 'aaaa000002']) && p1[0].hit === true && p1[1].hit === false && !('pt' in p1[0]), 'pick: 気になる語に当たる記事を先頭、残りはジャンルを順に回して新しい順(新しい記事のあるジャンルから: 技術 → 研究)');
      const p2 = F.pick(f, marks, { enabled: true, genres: ['tech'], keywords: [], n: 5 }, { today });
      ok(eq(p2.map((x) => x.id), ['aaaa000004', 'aaaa000005']) && eq(F.countByGenre(p2), { tech: 2 }) && F.summaryLine(p1, f) === '研究 2・技術 1', 'pick: ジャンルで絞る・印の付いたものは出ない・足りなければあるだけ / countByGenre / summaryLine');
      ok(F.hostOf('https://www.example.com/a?b') === 'example.com' && F.hostOf('nope') === '', 'hostOf');
      const p3 = F.pick(f, {}, { enabled: true, genres: [], keywords: ['tech', 'paper', 'runtime'], n: 3 }, { today });
      ok(F.hitCap(3) === 2 && F.hitCap(5) === 3 && F.hitCap(8) === 5 && eq(p3.map((x) => x.id), ['aaaa000003', 'aaaa000004', 'aaaa000002']) && p3[2].hit === true, 'pick: 気になる語に当たる記事が先頭を占めるのは n の 6 割まで(3 件なら 2)・残りは まだ出ていないジャンルから回す(当たりが技術に 3 つあっても 3 件目は研究)');
      const mg = S.migrate({ schema: 1, settings: {}, feed: { k1: { id: 'aaaa000001', at: '2026-10-30T07:00:00+09:00', state: 'skip' }, aaaa000002: { id: 'aaaa000002', at: '2026-10-29T07:00:00+09:00', state: 'weird' }, bad: { id: 'ZZ', at: '1' } } });
      ok(eq(Object.keys(mg.feed).sort(), ['aaaa000001', 'aaaa000002']) && mg.feed.aaaa000001.state === 'skip' && mg.feed.aaaa000002.state === 'open' && mg.feed.aaaa000002.date === '2026-10-29' && eq(S.defaultData().feed, {}), 'migrate: data.feed はキーを記事 id にそろえ、state は open / skip・壊れたものを捨てる・既定は空');
      const ma = S.migrate({ schema: 1, settings: {}, feed: { aaaa000001: { id: 'aaaa000001', at: '2026-10-30T07:00:00+09:00', state: 'open', updatedAt: '2026-10-30T07:00:00+09:00' } } });
      const mb = S.migrate({ schema: 1, settings: {}, feed: { aaaa000001: { id: 'aaaa000001', at: '2026-10-30T07:00:00+09:00', state: 'skip', updatedAt: '2026-10-30T09:00:00+09:00' }, aaaa000003: { id: 'aaaa000003', at: '2026-10-30T10:00:00+09:00', state: 'open', updatedAt: '2026-10-30T10:00:00+09:00' } } });
      const mm3 = M.sync.merge(ma, mb);
      ok(mm3.feed.aaaa000001.state === 'skip' && mm3.feed.aaaa000003 && Object.keys(mm3.feed).length === 2 && Object.keys(M.sync.pruneTombstones({ ...S.defaultData(), feed: { aaaa000001: { id: 'aaaa000001', at: '1', updatedAt: '1', deletedAt: '2026-01-01T00:00:00+09:00' } } }, '2026-10-30T00:00:00+09:00').feed).length === 0, 'sync.merge: 記事の印は id ごとに updatedAt の新しい方・古い tombstone は pruneTombstones で消える');
      ok(F.recentMarks({ a1: { id: 'a1', state: 'open', at: '2026-10-29T00:00:00Z' }, a2: { id: 'a2', state: 'open', at: '2026-10-30T00:00:00Z' }, a3: { id: 'a3', state: 'skip', at: '2026-10-31T00:00:00Z' } }).map((m) => m.id).join() === 'a2,a1' && eq(F.stats(marks, f), { opened: 1, skipped: 0, total: 5, updated: '2026-10-30T06:00:00Z' }), 'recentMarks(開いた記事を新しい順)/ stats(消した印は数えない)');
      ok(sw.includes(`'./js/feed.js'`) && sw.includes(`'./js/ui-feed.js'`) && /const DATA = \['\.\/data\/bgm\.json', '\.\/data\/feed\.json'\]/.test(sw) && !/ASSETS = \[[^\]]*feed\.json/.test(sw), 'sw.js: feed.js / ui-feed.js は ASSETS・data/feed.json は DATA(先読み+裏で更新・版と一緒に固定しない)');
      const real = await F.loadFeed();
      ok(real && real.genres.length >= 1 && real.items.length >= 1 && real.items.every((x) => /^[a-f0-9]{8,16}$/.test(x.id) && /^https?:\/\//.test(x.u) && real.genres.some((g) => g.id === x.g)), `同梱の記事の一覧: ${real && real.items.length} 件・${real && real.genres.length} ジャンル・id と URL の形`);
    }

    ok(false === true, 'ネガティブコントロール(これは必ず FAIL する)');
  } catch (e) {
    fails++; log('EXCEPTION ' + (e && e.stack || e));
  } finally {
    const line = `\n${total} tests, ${fails} failed(ネガティブコントロール1件を含む。期待値は1 failed)`;
    log(line);
    const s = document.createElement('div'); s.className = 'sum'; s.id = 'summary'; s.textContent = line.trim(); document.body.prepend(s);
    document.title = `${fails === 1 ? 'PASS' : 'FAIL'} merihari tests`;
  }
});
