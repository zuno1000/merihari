<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>merihari tests</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;display:flex;gap:16px;flex-wrap:wrap}
pre{flex:1;min-width:320px;white-space:pre-wrap;font-size:13px;margin:0}
iframe{width:390px;height:720px;border:1px solid #ccc;flex:none}
.sum{font-weight:700}
</style>
</head>
<body>
<pre id="out">loading…</pre>
<iframe id="app" src="../index.html" title="app under test"></iframe>
<script>
// 仕様書 §9: iframe 方式・localhost ガード・try/finally・ネガティブコントロール1件。
// 純関数だけを検証し、アプリの localStorage には触らない。
if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  document.body.textContent = 'localhost でのみ実行(python -m http.server 8000 → http://localhost:8000/tests/)';
  throw new Error('not localhost');
}
const out = document.getElementById('out');
let fails = 0, total = 0;
const log = (s) => { out.textContent += s + '\n'; };
function ok(cond, msg) { total++; if (!cond) fails++; log((cond ? 'ok   ' : 'FAIL ') + msg); }
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const throws = (fn) => { try { fn(); return false; } catch { return true; } };

document.getElementById('app').addEventListener('load', async () => {
  out.textContent = '';
  const W = document.getElementById('app').contentWindow;
  const M = W.M;
  try {
    ok(M && typeof M === 'object', 'window.M が公開されている');
    const { time: T, store: S } = M;

    // ---- time.js ----
    log('\n# time');
    ok(T.hm('07:30') === 450 && T.hm('7:05') === 425, 'hm: HH:MM → 分');
    ok(T.hm('x') === null && T.hm('25:00') === null && T.hm(null) === null, 'hm: 壊れた値は null');
    ok(T.mm(450) === '07:30' && T.mm(0) === '00:00', 'mm: 分 → HH:MM');
    ok(T.dateKey(new Date(2026, 9, 11)) === '2026-10-11', 'dateKey: ローカル YYYY-MM-DD');
    ok(T.dateKey(T.parseDateKey('2026-02-03')) === '2026-02-03', 'parseDateKey ↔ dateKey が往復する');
    ok(T.addDays('2026-10-31', 1) === '2026-11-01' && T.addDays('2026-01-01', -1) === '2025-12-31', 'addDays: 月またぎ・年またぎ');
    ok(T.weekday('2026-10-11') === 0 && T.dayKeyOf('2026-10-12') === 'mon', 'weekday / dayKeyOf');
    const d = S.defaultSettings();
    ok(eq(T.windowFor(d, '2026-10-11'), { start: 480, end: 1380 }), 'windowFor: 日曜は 08:00〜23:00');
    ok(eq(T.windowFor(d, '2026-10-12'), { start: 420, end: 1410 }), 'windowFor: 月曜は 07:00〜23:30');
    ok(T.windowFor({ window: { mon: ['23:00', '07:00'] } }, '2026-10-12') === null, 'windowFor: 終了≦開始は null');
    const rs = T.routinesFor(d, '2026-10-12');
    ok(rs.length === 4 && rs[0].name === '朝食' && rs[3].end === 1380, 'routinesFor: 既定4件が開始順・end=start+min');
    const dd = S.defaultSettings(); dd.routines[0].days = [1, 2, 3, 4, 5];
    ok(T.routinesFor(dd, '2026-10-11').length === 3, 'routinesFor: 曜日指定で除外される');
    dd.routines[1].off = true;
    ok(T.routinesFor(dd, '2026-10-12').length === 3, 'routinesFor: off は除外される');
    ok(eq(T.mergeIntervals([{ start: 10, end: 20 }, { start: 15, end: 30 }, { start: 40, end: 50 }, { start: 5, end: 5 }]),
      [{ start: 10, end: 30 }, { start: 40, end: 50 }]), 'mergeIntervals: 重なりをまとめ空区間を捨てる');
    ok(eq(T.subtractIntervals([{ start: 0, end: 100 }], [{ start: 10, end: 20 }, { start: 90, end: 120 }]),
      [{ start: 0, end: 10 }, { start: 20, end: 90 }]), 'subtractIntervals: 中抜き・端欠け');
    ok(T.sumMin([{ start: 0, end: 10 }, { start: 20, end: 25 }]) === 15, 'sumMin');
    ok(T.usableMin(d, '2026-10-12') === 750, 'usableMin 月曜: 990−150(ルーティン)−60(夜休憩)−30(習慣)=750');
    ok(T.usableMin(d, '2026-10-11') === 690, 'usableMin 日曜: 朝食は時間帯の外なので引かれない → 690');
    ok(T.workableMin(d, '2026-10-12') === 450, 'workableMin = usable × 0.6');
    ok(T.usableMin(d, '2026-10-12', [{ start: 600, end: 720 }]) === 630, 'usableMin: busy 等の追加区間を引く(昼食と重なる分は二重に引かない)');
    ok(T.usableMin({ window: {} }, '2026-10-12') === 0, 'usableMin: 時間帯が無ければ 0');
    ok(T.fmtMin(80) === '1h20m' && T.fmtMin(45) === '45m' && T.fmtMin(120) === '2h' && T.fmtMin(0) === '0m', 'fmtMin');
    ok(T.fmtMinJa(80) === '1時間20分' && T.fmtMinJa(60) === '1時間', 'fmtMinJa');

    // ---- store.js ----
    log('\n# store');
    const base = S.migrate(null);
    ok(base.schema === S.SCHEMA && base.settings.categories.length === 10 && eq(base.entries, {}), 'migrate(null): 既定データ(カテゴリ10件)');
    ok(S.defaultSettings().routines !== S.defaultSettings().routines, 'defaultSettings: 呼ぶたびに新しいオブジェクト');
    const broken = S.migrate({ schema: 1, bar: 2, settings: { transitMin: 'abc', ratio: 5, window: { mon: ['bad'] }, routines: [{ id: 'x', start: '9:00' }, { name: 'no start' }], foo: 1 }, entries: 'nope' });
    ok(broken.settings.transitMin === 50 && broken.settings.ratio === 0.6, 'migrate: 壊れたスカラーは既定値へ');
    ok(eq(base.settings.longRest, { min: 60, afterMin: 240 }) && !('eveningRest' in base.settings), 'defaultSettings: 長い休憩 60 分・目安 240 分(夜の休憩の時刻固定は無い)');
    const legacyRest = S.migrate({ schema: 1, settings: { eveningRest: { start: '20:00', min: 45 } } }).settings;
    ok(legacyRest.longRest.min === 45 && legacyRest.longRest.afterMin === 240 && !('eveningRest' in legacyRest), 'migrate: v0.6 の夜の休憩は長さだけ長い休憩へ引き継ぐ');
    ok(S.migrate({ schema: 1, settings: { longRest: { min: 0, afterMin: 'x' } } }).settings.longRest.afterMin === 240 && S.migrate({ schema: 1, settings: { longRest: { min: 0 } } }).settings.longRest.min === 0, 'migrate: 長い休憩 0 分は保持・壊れた目安は既定へ');
    ok(eq(S.migrate({ schema: 1, settings: { transitMemory: { '1:540': 20, '9:1': 5, '2:600': 'x', '3:615': 999 } } }).settings.transitMemory, { '1:540': 20 }), 'migrate: 移動の記憶はキーと範囲(0〜300)を検証');
    ok(T.longRestMin(base.settings) === 60 && T.longRestMin({}) === 0, 'longRestMin');
    ok(eq(broken.settings.window.mon, ['07:00', '23:30']) && eq(broken.settings.window.sat, ['08:00', '23:00']), 'migrate: 壊れた曜日だけ既定値へ');
    ok(broken.settings.routines.length === 1 && broken.settings.routines[0].min === 30 && eq(broken.settings.routines[0].days, [0, 1, 2, 3, 4, 5, 6]), 'migrate: ルーティンは start 必須・min/days を補完');
    ok(broken.settings.foo === 1 && broken.bar === 2, 'migrate: 未知キーを保持(前方互換)');
    ok(eq(broken.entries, {}) && eq(broken.meta.resetAt, null), 'migrate: entries/meta を補完');
    const legacy = S.migrate({ schema: 1, settings: { categories: [{ id: 'research', name: '研究', kind: 'work', color: '#2b6cb0', order: 1 }, { id: 'sns', name: 'SNS', kind: 'drift', color: '#123456', order: 2 }, { id: 'new', name: 'x', kind: 'work', color: 'bad', order: 3 }] } });
    ok(legacy.settings.categories[0].color === '#2a78d6' && legacy.settings.categories[1].color === '#123456' && legacy.settings.categories[2].color === '#718096', 'migrate: 旧既定色は新既定色へ・自分で変えた色は保持・壊れた色は灰');
    const once = S.migrate({ schema: 1, settings: { transitMin: 40 } });
    ok(eq(S.migrate(once), once), 'migrate: 冪等');
    ok(once.settings.transitMin === 40, 'migrate: 正しい値は保持');
    ok(throws(() => S.validateImport({})) && throws(() => S.validateImport([1])) && throws(() => S.validateImport('x')), 'validateImport: merihari 以外は拒否');
    ok(throws(() => S.validateImport({ schema: 99, settings: {} })), 'validateImport: 新しい schema は拒否');
    ok(S.validateImport({ schema: 1, settings: {} }).schema === 1, 'validateImport: 通れば migrate 済みを返す');

    // ---- log.js(F1) ----
    log('\n# log');
    const L = M.log;
    let seq = 0;
    const C = { uid: () => 'e' + (++seq), nowISO: () => '2026-10-11T16:00:00+09:00' };
    const D = '2026-10-11';
    const alive = (es) => Object.values(es).filter((e) => !e.deletedAt).sort((a, b) => T.hm(a.start) - T.hm(b.start)).map((e) => `${e.categoryId} ${e.start}-${e.end ?? 'open'}`);
    const wEnd = () => 1410; // 23:30
    let es = {};
    let r = L.start(es, { date: D, nowMin: 870, categoryId: 'research', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-open']), 'start: 現在時刻から記録中エントリを作る');
    ok(eq(es, {}), 'start: 引数の entries を変更しない(純関数)');
    es = r.entries;
    r = L.start(es, { date: D, nowMin: 880, categoryId: 'research', windowEndOf: wEnd }, C);
    ok(r.ignored === true && eq(alive(r.entries), ['research 14:30-open']), 'start: 同じカテゴリの連打は無視(F1-1)');
    r = L.start(es, { date: D, nowMin: 900, categoryId: 'rest', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-open']), 'start: 次のチップで直前を現在時刻で閉じる(連続記録)');
    es = r.entries;
    r = L.stop(es, { date: D, nowMin: 915, windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:15']) && r.closed.categoryId === 'rest', 'stop: 記録中を現在時刻で閉じる');
    es = r.entries;
    ok(L.openEntry(es) === null && L.openEntry(r.entries) === null, 'openEntry: 記録中が無ければ null');
    r = L.start(es, { date: D, nowMin: 965, startMin: 930, categoryId: 'english', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:15', 'english 15:30-open']), 'start: さっきから(startMin)で過去から記録中にできる(F1-2)');
    es = r.entries;
    r = L.start(es, { date: D, nowMin: 965, startMin: 905, categoryId: 'sns', windowEndOf: wEnd }, C);
    ok(eq(alive(r.entries), ['research 14:30-15:00', 'rest 15:00-15:05', 'sns 15:05-open']), 'start: 事後入力が記録中と重なれば記録中は捨て、前の記録は詰める');
    r = L.stop(es, { date: D, nowMin: 1000, windowEndOf: wEnd }, C);
    es = r.entries; // research 14:30-15:00, rest 15:00-15:15, english 15:30-16:40
    const engId = Object.values(es).find((e) => e.categoryId === 'english').id;
    r = L.setTimes(es, engId, { start: '15:10', end: '16:00' }, 1000, C);
    ok(eq(alive(r), ['research 14:30-15:00', 'rest 15:00-15:10', 'english 15:10-16:00']), 'setTimes: 時刻編集で隣を詰める(F1-7)');
    ok(throws(() => L.setTimes(es, engId, { start: '16:00', end: '15:00' }, 1000, C)), 'setTimes: 終了≦開始は拒否');
    let big = L.start({}, { date: D, nowMin: 600, startMin: 540, categoryId: 'life', windowEndOf: wEnd }, C).entries;
    big = L.stop(big, { date: D, nowMin: 1080, windowEndOf: wEnd }, C).entries; // life 09:00-18:00
    let mid = L.start(big, { date: D, nowMin: 870, categoryId: 'research', windowEndOf: wEnd }, C); // 14:30 に生活の途中で研究を開始
    mid = L.stop(mid.entries, { date: D, nowMin: 960, windowEndOf: wEnd }, C).entries; // 16:00 に終了 → 生活の後半が残る
    ok(eq(alive(mid), ['life 09:00-14:30', 'research 14:30-16:00', 'life 16:00-18:00']), 'resolveOverlap: 真ん中に入れると前後に分割される');
    const covered = L.setTimes(mid, Object.values(mid).find((e) => e.categoryId === 'research').id, { start: '08:00', end: '19:00' }, 1200, C);
    ok(eq(alive(covered), ['research 08:00-19:00']) && Object.values(covered).filter((e) => e.deletedAt).length === 2, 'resolveOverlap: 丸ごと覆われた記録は tombstone(deletedAt)で残る');
    let ys = { a: { id: 'a', date: '2026-10-10', start: '22:00', end: null, categoryId: 'research', updatedAt: 'x', deletedAt: null } };
    r = L.closeOpen(ys, { date: D, at: 600, windowEndOf: () => 1410 }, C);
    ok(r.closed.end === '23:30', 'closeOpen: 前日の記録中はその日の作業時間帯の終わりで閉じる(F1-3)');
    r = L.closeOpen(ys, { date: D, at: 600, windowEndOf: () => 1300 }, C);
    ok(r.closed.end === '24:00', 'closeOpen: 作業時間帯の終わりが開始より前なら 24:00');
    r = L.start(ys, { date: D, nowMin: 600, categoryId: 'research', windowEndOf: () => 1410 }, C);
    ok(eq(alive(r.entries), ['research 10:00-open', 'research 22:00-23:30']), 'start: 前日の同カテゴリ記録中は無視せず閉じて今日の分を作る');
    ok(L.elapsedMin({ start: '14:30', end: null, date: D }, D, 900) === 30 && L.elapsedMin(ys.a, D, 600) === 120, 'elapsedMin: 同日は now まで・別日は 24:00 まで');
    ok(L.isStale({ start: '10:00', end: null, date: D }, D, 780) && !L.isStale({ start: '10:00', end: null, date: D }, D, 700), 'isStale: 3時間以上で止め忘れ(F1-4)');
    ok(eq(L.totalsByCategory(mid, D, 1200), { life: 450, research: 90 }), 'totalsByCategory');
    const cands = L.backfillCandidates(es, D, 1000);
    ok(cands[0].min === 915 && eq(cands.map((c) => c.min), [915, 985, 970, 940]), 'backfillCandidates: 直前の終わり/15分前/30分前/1時間前(重複なし)');
    ok(eq(L.backfillCandidates({}, D, 20).map((c) => c.min), [5]), 'backfillCandidates: 0:00 より前の候補は出さない');
    const sp = L.split(mid, Object.values(mid).find((e) => e.categoryId === 'research').id, 900, 1200, C);
    ok(eq(alive(sp), ['life 09:00-14:30', 'research 14:30-15:00', 'research 15:00-16:00', 'life 16:00-18:00']), 'split: ここで分ける');
    ok(throws(() => L.split(mid, Object.values(mid)[0].id, 1300, 1200, C)), 'split: 範囲外は拒否');
    const rm = L.remove(es, engId, C);
    ok(rm[engId].deletedAt && !es[engId].deletedAt && L.entriesOf(rm, D).length === 2, 'remove: tombstone・元は変更しない・entriesOf から消える');

    // ---- plan.js(F2 / F5-2) ----
    log('\n# plan');
    const Pn = M.plan;
    let pseq = 0;
    const PC = { uid: () => 'b' + (++pseq), nowISO: () => '2026-10-12T07:00:00+09:00' };
    const MON = '2026-10-12'; // 月曜(作業 07:00〜23:30・workable 450)
    const ds = S.defaultSettings();
    const noOverlap = (bs) => { const x = bs.slice().sort((a, b) => a.start - b.start); return x.every((b, i) => i === 0 || b.start >= x[i - 1].end); };
    const tasksA = {
      t1: { id: 't1', name: '修論', kind: 'duty', deadline: '2026-10-20T23:59', remainingH: 12, minUnit: 30, categoryId: 'research', deletedAt: null, doneAt: null },
      t2: { id: 't2', name: '面談資料', kind: 'duty', deadline: '2026-10-13', remainingH: 1, minUnit: 30, categoryId: 'research', deletedAt: null, doneAt: null },
      w1: { id: 'w1', name: 'Blender', kind: 'wish', deadline: null, remainingH: 5, minUnit: 30, categoryId: 'other', deletedAt: null, doneAt: null },
      d1: { id: 'd1', name: '済み', kind: 'duty', deadline: '2026-10-12', remainingH: 2, minUnit: 30, categoryId: 'other', deletedAt: null, doneAt: 'x' },
    };
    ok(Pn.deadlineKey({ deadline: '2026-10-20T23:59' }) === '2026-10-20' && Pn.deadlineKey({ deadline: null }) === null, 'deadlineKey: 日付部分だけ');
    ok(Pn.deadlineKey({ repeat: { type: 'weekly', weekEnd: 'sun' } }, MON) === '2026-10-18', 'deadlineKey: 毎週型は今週の日曜');
    ok(Pn.availableUntil(ds, MON, MON) === 450 && Pn.availableUntil(ds, MON, '2026-10-13') === 900, 'availableUntil: 期限まで(両端含む)の workable 合計');
    const sh = Pn.todayShare(tasksA, MON, ds);
    ok(sh.length === 2 && sh[0].taskId === 't2' && sh[1].taskId === 't1', 'todayShare: 義務だけを期限順(やりたい・完了は除く)');
    ok(sh[0].todayMin === 30 && sh[1].todayMin === 80, 'todayShare: EDF 配分(面談 60×450/900=30, 修論 720×450/3978≈80)');
    const late = Pn.todayShare({ x: { id: 'x', name: 'x', kind: 'duty', deadline: '2026-10-11', remainingH: 10, minUnit: 30 } }, MON, ds);
    ok(late[0].todayMin === 600 && late[0].short === true, 'todayShare: 期限超過は残り全部を前倒しし short=true');
    ok(Pn.todayShare({ x: { id: 'x', name: 'x', kind: 'duty', deadline: '2026-12-31', remainingH: 0.5, minUnit: 30 } }, MON, ds)[0].todayMin === 0, 'todayShare: 配分が最小単位の半分未満なら今日は 0');
    ok(eq(Pn.loggedByTask({ a: { date: MON, start: '09:00', end: '10:00', taskId: 't1' }, b: { date: MON, start: '10:00', end: null, taskId: 't1' }, c: { date: MON, start: '11:00', end: '11:30', taskId: null } }, MON, 630), { t1: 90 }), 'loggedByTask: 記録中は now まで・紐づき無しは数えない');
    const WM = T.windowFor(ds, MON);
    const busyA = [{ id: 'A', start: 540, end: 630 }, { id: 'B', start: 660, end: 720 }, { id: 'C', start: 960, end: 990 }, { id: 'D', start: 1140, end: 1200 }];
    const g = Pn.groupOuting(busyA.map((b) => ({ ...b, out: true })), ds, WM);
    ok(g.length === 1 && g[0].start === 540 && g[0].end === 720 && eq(g[0].ids, ['A', 'B']), 'groupOuting: 45分以上・日中の busy を片道×2 未満の間隔でまとめる(30分の予定と18時以降は除外)');
    ok(Pn.groupOuting(busyA.map((b) => ({ ...b, out: b.id !== 'A' })), ds, WM)[0].start === 660, 'groupOuting: 在宅(out=false)の予定は除外');
    ok(Pn.groupOuting(Pn.decideOuting(busyA, ds, MON, {}), ds, WM).length === 0, 'groupOuting: 既定(原則在宅)では空');
    ok(eq(Pn.placeOrShift({ start: 720, end: 765 }, [{ start: 690, end: 750 }], WM), { start: 750, end: 795, shifted: true }), 'placeOrShift: 重なれば直後の空きへ 15 分刻み');
    ok(Pn.placeOrShift({ start: 1380, end: 1440 }, [{ start: 1380, end: 1410 }], WM) === null, 'placeOrShift: 入らなければ null');
    ok(eq(Pn.freeSlots([{ start: 600, end: 660 }], 540, 720), [{ start: 540, end: 600 }, { start: 660, end: 720 }]), 'freeSlots');
    const p0 = Pn.buildPlan({ settings: ds, date: MON, nowMin: 420, tasks: {}, entries: {} }, PC);
    const types = (p) => p.blocks.map((b) => b.type);
    ok(types(p0).filter((t) => t === 'routine').length === 4 && !p0.blocks.some((b) => b.type === 'rest'), 'buildPlan: ルーティン4件・タスクが無い日は休憩も置かない(v0.7: 時刻固定の夜の休憩は廃止)');
    const hb = p0.blocks.find((b) => b.type === 'habit');
    ok(hb && hb.start === 450 && hb.end === 480 && hb.name === '英語', 'buildPlan: 朝の習慣は朝食直後の空き(07:30〜08:00)');
    ok(noOverlap(p0.blocks) && !types(p0).includes('task'), 'buildPlan: 重なり無し・タスク無しなら task ブロック無し');
    const p1 = Pn.buildPlan({ settings: ds, date: MON, nowMin: 540, tasks: { t1: tasksA.t1 }, entries: {}, fill: false }, PC);
    const tb = p1.blocks.filter((b) => b.type === 'task');
    ok(tb.length === 1 && tb[0].start === 540 && tb[0].end === 620 && tb[0].taskId === 't1' && tb[0].categoryId === 'research', 'buildPlan: 今日の分 80 分を now(09:00) から 1 ブロックで置く');
    ok(p1.shortfall.length === 0 && noOverlap(p1.blocks), 'buildPlan: 入り切れば shortfall 無し');
    const bigT = { x: { id: 'x', name: '大物', kind: 'duty', deadline: '2026-10-12', remainingH: 10, minUnit: 30, categoryId: 'research' } };
    const p2 = Pn.buildPlan({ settings: ds, date: MON, nowMin: 540, tasks: bigT, entries: {} }, PC);
    const tb2 = p2.blocks.filter((b) => b.type === 'task'), rb2 = p2.blocks.filter((b) => b.type === 'rest' && b.auto);
    const total2 = tb2.reduce((a, b) => a + b.end - b.start, 0);
    ok(tb2.every((b) => b.end - b.start >= 30 && b.end - b.start <= 90) && noOverlap(p2.blocks), 'buildPlan: task ブロックは最小単位以上・最大 90 分・重なり無し');
    ok(tb2.every((b) => b.end <= WM.end - 30) && tb2[0].start === 540, 'buildPlan: 最後の 30 分には置かない');

    ok(Pn.decideOuting(busyM, { ...ds, outingDefault: 'weekday', outingDays: [1, 3] }, MON, {})[0].out === true && Pn.decideOuting(busyM, { ...ds, outingDefault: 'weekday', outingDays: [2] }, MON, {})[0].out === false, 'decideOuting: 曜日で決める(月曜)');
    ok(Pn.outingMemoryKey(MON, 607) === '1:600', 'outingMemoryKey: 曜日:開始(15分丸め)');
    const dMem = Pn.decideOuting(busyM, { ...ds, outingMemory: { '1:600': 'out' } }, MON, {});
    ok(dMem[0].out === true && dMem[0].outingSource === 'memory' && dMem[1].out === false, 'decideOuting: 同じ曜日・時刻の記憶を使う');
    const dOv = Pn.decideOuting(busyM, { ...ds, outingMemory: { '1:600': 'out' } }, MON, { A: 'home', B: 'out' });
    ok(dOv[0].out === false && dOv[0].outingSource === 'override' && dOv[1].out === true, 'decideOuting: 当日の上書きが最優先');
    const pHome = Pn.buildPlan({ settings: ds, date: MON, nowMin: 420, tasks: {}, entries: {}, busy: busyM }, PC);
    ok(!pHome.blocks.some((b) => b.type === 'transit') && pHome.blocks.filter((b) => b.type === 'busy').length === 2, 'buildPlan: 原則在宅なら予定だけで移動は置かない');
    const pOut = Pn.buildPlan({ settings: { ...ds, outingMemory: { '1:600': 'out' } }, date: MON, nowMin: 420, tasks: {}, entries: {}, busy: busyM }, PC);
    ok(pOut.blocks.filter((b) => b.type === 'transit').length === 2 && pOut.blocks.find((b) => b.type === 'busy').out === true, 'buildPlan: 記憶で外出になった予定の前後に移動');
    const bigNoDl = { big: { id: 'big', name: '大物', kind: 'duty', deadline: null, remainingH: 20, minUnit: 30, categoryId: 'research', deletedAt: null, doneAt: null } };
    ok(Pn.todayShare(bigNoDl, MON, ds)[0].todayMin === 0, 'todayShare: 期限なしの義務は今日の分 0');
    const pFill = Pn.buildPlan({ settings: ds, date: MON, nowMin: 540, tasks: bigNoDl, entries: {} }, PC);
    const fb = pFill.blocks.filter((b) => b.type === 'task');
    const fillMin = fb.reduce((a, b) => a + b.end - b.start, 0);
    ok(fb.length >= 3 && fb.every((b) => b.filler && b.taskId === 'big' && b.end - b.start >= 30 && b.end - b.start <= 90) && fillMin >= 420 && fillMin <= 450, 'buildPlan: 期限なしの大物を余った作業枠(workable 450)に 90 分以下で細分化して入れる');
    ok(noOverlap(pFill.blocks) && pFill.blocks.filter((b) => b.type === 'rest' && b.auto).length >= 2, 'buildPlan: 細分化した枠も重ならず・90 分ごとに休憩');
    ok(!Pn.buildPlan({ settings: ds, date: MON, nowMin: 540, tasks: bigNoDl, entries: {}, fill: false }, PC).blocks.some((b) => b.type === 'task'), 'buildPlan: fill:false なら空き配分をしない');
    const pMix = Pn.buildPlan({ settings: ds, date: MON, nowMin: 540, tasks: { ...tasksA, ...bigNoDl }, entries: {} }, PC);
    const order = pMix.blocks.filter((b) => b.type === 'task').map((b) => b.taskId);
    ok(order[0] === 't2' && order[1] === 't1' && pMix.blocks.some((b) => b.filler) && !order.includes('w1'), 'buildPlan: 今日の分(期限順)が先・余りは期限順に細分化・やりたいは入れない');
    const added = L.addEntry({ x: { id: 'x', date: D, start: '09:00', end: '12:00', categoryId: 'life', updatedAt: 'x', deletedAt: null } }, { date: D, startMin: 600, endMin: 660, categoryId: 'research' }, C);
    ok(eq(alive(added), ['life 09:00-10:00', 'research 10:00-11:00', 'life 11:00-12:00']), 'addEntry: 閉じた記録を追加し隣を詰める(分割)');
    ok(throws(() => L.addEntry({}, { date: D, startMin: 660, endMin: 600, categoryId: 'a' }, C)), 'addEntry: 終了≦開始は拒否');
    const dirty = S.migrate({ schema: 1, settings: {}, entries: { ok1: { id: 'ok1', date: '2026-10-12', start: '09:00', end: '10:00', categoryId: 'research' }, bad1: { id: 'bad1', date: 'x', start: '09:00' }, bad2: 'str', '__proto__': { id: 'p', date: '2026-10-12', start: '09:00', end: null } }, tasks: { t: { id: 't', name: 'n', remainingH: 'abc', minUnit: 9999, kind: 'weird', repeat: { type: 'weekly', hours: 'x' } }, nope: { noName: 1 } }, plans: { '2026-10-12': { blocks: [{ type: 'task', start: 540, end: 600 }, { type: 'evil', start: 0, end: 10 }, { type: 'busy', start: 'a' }] } }, reports: { '2026-10-11': { lines: ['a', 1, 'b'], coverage: 7 } }, ledger: { '2026-10-11': { usableMin: 'x', workMin: 100 } } });
    ok(Object.keys(dirty.entries).join() === 'ok1' && !('id' in dirty.entries), 'migrate: 壊れた記録は捨て、__proto__ キーは無視(prototype を汚さない)');
    ok(dirty.tasks.t.remainingH === 0 && dirty.tasks.t.minUnit === 30 && dirty.tasks.t.kind === 'duty' && dirty.tasks.t.repeat.hours === 5 && !dirty.tasks.nope, 'migrate: タスクの型を正規化・名前の無いものは捨てる');
    ok(dirty.plans['2026-10-12'].blocks.length === 1 && dirty.reports['2026-10-11'].lines.length === 2 && dirty.reports['2026-10-11'].coverage === 0 && dirty.ledger['2026-10-11'].usableMin === 0, 'migrate: plan/report/ledger の壊れた要素を落とす');
    ok(S.migrate({ schema: 1, settings: { outingByBusy: true } }).settings.outingDefault === 'home' && S.migrate({ schema: 1, settings: { outingDefault: 'weekday', outingDays: [1, 9], outingMemory: { '1:600': 'out', 'x': 'out', '2:630': 'maybe' } } }).settings.outingDays.join() === '1' , 'migrate: 外出設定(旧 outingByBusy は原則在宅へ・曜日と記憶を検証)');
    const nowT = 1_000_000_000;
    const dec = (o) => Sy.autoSyncDecision({ connected: true, hasToken: true, hasPass: true, online: true, now: nowT, lastSyncAt: 0, pending: false, ...o });
    ok(dec({}) === 'silent' && dec({ hasToken: false }) === 'gesture' && dec({ hasPass: false }) === 'gesture', 'autoSyncDecision: 鍵が揃えば静かに・無ければ次のタップで');
    ok(dec({ connected: false }) === 'none' && dec({ online: false }) === 'none' && dec({ lastSyncAt: nowT - 60000 }) === 'none' && dec({ lastSyncAt: nowT - 6 * 60000 }) === 'silent', 'autoSyncDecision: 未接続・オフライン・5 分以内は何もしない');
    let badFile = false; try { await Sy.decrypt(JSON.stringify({ v: 1, kdf: 'PBKDF2-SHA256-10', salt: 'AA==', iv: 'AA==', ct: 'AA==' }), 'x'); } catch (e) { badFile = /不正/.test(e.message); }
    ok(badFile, 'decrypt: 反復回数が異常なファイルは拒否');
    let badJson = false; try { await Sy.decrypt('{not json', 'x'); } catch (e) { badJson = /不正/.test(e.message); }
    ok(badJson, 'decrypt: 壊れた JSON は拒否');

    // ---- 版規約(§9) ----
    log('\n# version');
    const sw = await (await fetch('../sw.js', { cache: 'no-store' })).text();
    ok(sw.includes(`'merihari-v${M.APP_VERSION}'`), `sw.js の CACHE 名が APP_VERSION(${M.APP_VERSION})と一致`);
    ok(M.NEWS && M.NEWS[0] && M.NEWS[0].v === M.APP_VERSION, 'NEWS の先頭が APP_VERSION');
    for (const f of ['main', 'store', 'time', 'log', 'plan', 'report', 'palette', 'ui-report', 'google', 'sync', 'ui', 'ui-today', 'ui-tasks', 'ui-settings']) ok(sw.includes(`'./js/${f}.js'`), `sw.js の ASSETS に js/${f}.js がある`);

    // ---- 画面(骨組み) ----
    log('\n# ui');
    const doc = W.document;
    ok(doc.querySelectorAll('#tabs button[data-tab]').length === 4, 'タブは4つ(今/タイムライン/タスク/設定)');
    ok(!!doc.querySelector('#view h1'), '画面に見出しが描かれている');
    ok(getComputedStyle(doc.body).touchAction === 'manipulation', 'touch-action: manipulation');

    ok(false === true, 'ネガティブコントロール(これは必ず FAIL する)');
  } catch (e) {
    fails++; log('EXCEPTION ' + (e && e.stack || e));
  } finally {
    const line = `\n${total} tests, ${fails} failed(ネガティブコントロール1件を含む。期待値は 1 failed)`;
    log(line);
    const s = document.createElement('div'); s.className = 'sum'; s.id = 'summary'; s.textContent = line.trim(); document.body.prepend(s);
    document.title = `${fails === 1 ? 'PASS' : 'FAIL'} merihari tests`;
  }
});
</script>
