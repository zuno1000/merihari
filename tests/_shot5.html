<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>shot5</title>
<style>body{margin:0;background:#888;display:flex;gap:10px;padding:10px}iframe{width:390px;height:900px;border:0;background:#fff}</style></head>
<body>
<iframe id="a" src="../index.html"></iframe>
<script type="module">
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (W) => { for (let i = 0; i < 100 && !W.M; i++) await wait(100); };
const ia = document.getElementById('a');
await until(ia.contentWindow);
const S = ia.contentWindow.M.store;
const today = new Date(); const z = (n) => String(n).padStart(2, '0'); const dk = `${today.getFullYear()}-${z(today.getMonth() + 1)}-${z(today.getDate())}`;
const yk = (() => { const d = new Date(today); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; })();
const y2 = (() => { const d = new Date(today); d.setDate(d.getDate() - 2); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; })();
const data = S.defaultData();
data.meta.setupAt = '2026-10-01T00:00:00+09:00';
data.tasks = {
  h: { id: 'h', name: '英語', kind: 'duty', repeat: { type: 'daily', min: 30 }, categoryId: 'english', checks: [y2, yk], remainingH: 0, updatedAt: '2026-10-20T00:00:00+09:00' },
  w: { id: 'w', name: 'ギター', kind: 'wish', categoryId: 'other', remainingH: 0, updatedAt: '2026-10-20T00:00:00+09:00' },
  m: { id: 'm', name: '歯医者に電話', kind: 'memo', categoryId: 'other', remainingH: 0, updatedAt: '2026-10-26T00:00:00+09:00' },
  m2: { id: 'm2', name: '来週の輪講の資料、図を差し替える', kind: 'memo', categoryId: 'other', remainingH: 0, updatedAt: '2026-10-27T00:00:00+09:00' },
  t: { id: 't', name: '面談資料', kind: 'duty', deadline: dk, remainingH: 2, categoryId: 'research', updatedAt: '2026-10-20T00:00:00+09:00', remainingSetAt: '2026-10-20T00:00:00+09:00' },
};
data.entries = { e1: { id: 'e1', date: dk, start: '08:00', end: '08:30', categoryId: 'life', taskId: null, note: '', updatedAt: '2026-10-27T08:30:00+09:00' }, e2: { id: 'e2', date: y2, start: '20:00', end: '20:40', categoryId: 'other', taskId: 'w', note: '', updatedAt: '2026-10-25T20:40:00+09:00' } };
data.busyNotes = { [`${dk}:540`]: { id: `${dk}:540`, date: dk, start: 540, text: 'ゼミ', updatedAt: '2026-10-27T08:00:00+09:00' } };
const local = S.defaultLocal(); local.busyCache = { fetchedAt: Date.now(), busy: [{ start: `${dk}T09:00:00`, end: `${dk}T10:30:00` }, { start: `${dk}T20:00:00`, end: `${dk}T21:00:00` }] };
ia.contentWindow.localStorage.setItem(S.KEY, JSON.stringify(data)); ia.contentWindow.localStorage.setItem(S.LOCAL_KEY, JSON.stringify({ ...local, uiState: { tab: 'tasks' } }));
const reload = async (f) => { const p = new Promise((r) => f.addEventListener('load', r, { once: true })); f.contentWindow.location.reload(); await p; await until(f.contentWindow); await wait(500); };
await reload(ia);
await wait(400);
ia.contentDocument.querySelector('.quick input')?.dispatchEvent(new ia.contentWindow.Event('focus'));
document.body.append(Object.assign(document.createElement('pre'), { textContent: 'left tab=' + ia.contentDocument.querySelector('#tabs button.active')?.dataset.tab + ' quick=' + !!ia.contentDocument.querySelector('.quick input') }));
document.title = 'SHOT READY';
</script>
</body></html>
